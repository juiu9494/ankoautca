<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politica – Notizie e approfondimenti | ANKOAUTCA</title>
    <meta name="description" content="Ultime notizie di politica italiana e internazionale: governo, parlamento, elezioni, analisi. Segui gli aggiornamenti su ANKOAUTCA.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.ankoautca.it/Politica.html">
    <meta property="og:title" content="Politica – ANKOAUTCA">
    <meta property="og:description" content="Notizie di politica: crisi di governo, riforme, elezioni.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Sans+3:wght@300;400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root {--red:#C0121C;--black:#0A0A0A;--white:#fff;--cream:#faf9f7;--gray-500:#777;--gray-100:#f4f4f2;--font-display:'Playfair Display',serif;--font-body:'Source Sans 3',sans-serif;--font-serif:'Source Serif 4',serif;}
        *{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-body);background:var(--cream);color:var(--black);line-height:1.6}
        a{text-decoration:none;color:inherit}
        .topbar{background:var(--black);color:#aaa;font-size:12px;padding:6px 0;border-bottom:2px solid var(--red)}
        .topbar-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between}
        .topbar-links{display:flex;gap:16px}
        .topbar-links a{color:#bbb;font-size:11px;text-transform:uppercase;letter-spacing:.5px;transition:.2s}
        .topbar-links a:hover{color:var(--red)}
        header{background:var(--white);border-bottom:3px solid var(--black);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.08)}
        .masthead{max-width:1280px;margin:0 auto;padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px}
        .logo-text{font-family:var(--font-display);font-size:48px;font-weight:900;letter-spacing:-2px;color:var(--black);line-height:1}
        .logo-text span{color:var(--red)}
        .logo-tagline{font-family:var(--font-serif);font-style:italic;font-size:12px;color:var(--gray-500);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
        nav.mainnav{background:var(--black)}
        .mainnav-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;overflow-x:auto}
        .mainnav-inner a{color:#ddd;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:12px 16px;white-space:nowrap;border-bottom:3px solid transparent;transition:.2s}
        .mainnav-inner a:hover,.mainnav-inner a.active{color:white;border-bottom-color:var(--red)}
        .container{max-width:1280px;margin:0 auto;padding:0 20px}
        .page-header{margin:30px 0 20px}
        .page-title{font-family:var(--font-display);font-size:42px;font-weight:900}
        .category-desc{font-family:var(--font-serif);font-style:italic;font-size:16px;color:var(--gray-500);margin-top:8px}
        .articles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;margin-top:30px}
        .card{background:white;border:1px solid #e8e6e1;border-radius:4px;overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:pointer}
        .card:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(0,0,0,.1)}
        .card-img{height:180px;overflow:hidden}
        .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
        .card:hover .card-img img{transform:scale(1.05)}
        .card-body{padding:16px}
        .card-cat{display:inline-block;background:var(--red);color:white;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:2px;margin-bottom:8px}
        .card-title{font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1.25;margin-bottom:8px;color:var(--black);transition:color .2s}
        .card:hover .card-title{color:var(--red)}
        .card-excerpt{font-size:13px;color:var(--gray-500);font-family:var(--font-serif);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .card-meta{font-size:11px;color:var(--gray-500);margin-top:10px;display:flex;justify-content:space-between}
        footer{background:var(--black);color:#aaa;margin-top:50px;padding:30px 0 20px}
        .footer-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;font-size:13px}
        .footer-links{display:flex;gap:16px;flex-wrap:wrap}
        .footer-links a{color:#888;transition:.2s}
        .footer-links a:hover{color:var(--red)}
    </style>
</head>
<body>
    <div class="topbar"><div class="topbar-inner"><div>Venerdì 15 Maggio 2026</div><div class="topbar-links"><a href="/">Home</a><a href="Politica.html">Politica</a><a href="Mondo.html">Mondo</a><a href="Sport.html">Sport</a></div></div></div>
    <header>
        <div class="masthead"><div><div class="logo-text"><span>A</span>NKOAUTCA</div><div class="logo-tagline">Il Portale Italiano dell'Informazione</div></div></div>
        <nav class="mainnav"><div class="mainnav-inner"><a href="/">Home</a><a href="Politica.html" class="active">Politica</a><a href="Economia.html">Economia</a><a href="Mondo.html">Mondo</a><a href="Sport.html">Sport</a><a href="Tecnologia.html">Tecnologia</a></div></nav>
    </header>
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Politica</h1>
            <p class="category-desc">Governo, parlamento, elezioni e analisi. Segui le ultime notizie politiche italiane e internazionali.</p>
        </div>
        <div class="articles-grid" id="politica-grid"></div>
    </div>
    <footer><div class="footer-inner"><div>© 2026 ANKOAUTCA</div><div class="footer-links"><a href="Privacy.html">Privacy</a><a href="#">Contatti</a></div></div></footer>
    <script>
        const articoli = [
            {titolo:'Crisi di governo: il premier verso le dimissioni',desc:'Dopo settimane di tensione, il Presidente del Consiglio annuncerà le dimissioni. Scenari e possibili soluzioni.',img:'https://www.today.it/~media/horizontal-hi/60941665651336/jeliazkov.jpg',link:'politica-crisi-governo.html',data:'2 ore fa'},
            {titolo:'Riforma costituzionale approvata: cosa cambia',desc:'Con 318 voti a favore, la Camera ha dato il via libera alla riforma che modifica 12 articoli della Costituzione.',img:'https://picsum.photos/seed/pol2/600/400',link:'articolo.html?title=Il Presidente del Consiglio annuncia le dimissioni%3A crisi di governo aperta&desc=Dopo settimane di tensioni nella maggioranza%2C il premier ha rassegnato le dimissioni al Quirinale.&img=https%3A%2F%2Fpicsum.photos%2Fseed%2Fpol2%2F800%2F500&cat=Politica&author=Marco Ferretti&date=2026-05-16T02%3A46%3A17.406Z&url=',data:'5 ore fa'},
            {titolo:'Elezioni regionali Lombardia: centrodestra in testa',desc:'Ultimi sondaggi danno la coalizione di governo avanti di 8 punti. L\'affluenza sarà decisiva.',img:'https://picsum.photos/seed/pol3/600/400',link:'politica-regionali-lombardia.html',data:'ieri'},
            {titolo:'Legge di Bilancio 2027: le misure chiave',desc:'Taglio del cuneo fiscale, pensioni e investimenti green: ecco i punti principali della manovra da 35 miliardi.',img:'https://picsum.photos/seed/pol4/600/400',link:'politica-legge-bilancio.html',data:'2 giorni fa'},
            {titolo:'Caso giustizia: scontro tra governo e magistratura',desc:'La riforma del CSM infiamma il dibattito. Le opposizioni annunciano ostruzionismo in Parlamento.',img:'https://picsum.photos/seed/pol5/600/400',link:'politica-scontro-giustizia.html',data:'3 giorni fa'},
            {titolo:'Intervista esclusiva al Ministro degli Esteri',desc:'"L\'Italia deve tornare protagonista in Europa": il Ministro parla di Mediterraneo e migrazioni.',img:'https://picsum.photos/seed/pol6/600/400',link:'politica-intervista-ministro.html',data:'4 giorni fa'}
        ];
        const grid = document.getElementById('politica-grid');
        grid.innerHTML = articoli.map(a => `
            <div class="card" onclick="location.href='${a.link}'">
                <div class="card-img"><img src="${a.img}" alt="${a.titolo}" loading="lazy"></div>
                <div class="card-body">
                    <span class="card-cat">Politica</span>
                    <h2 class="card-title">${a.titolo}</h2>
                    <p class="card-excerpt">${a.desc}</p>
                    <div class="card-meta"><span>Redazione</span><span><i class="ti ti-clock"></i> ${a.data}</span></div>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
