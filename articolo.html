<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articolo — ANKOAUTCA</title>
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Sans+3:wght@300;400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GB5VWDMCE1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GB5VWDMCE1');
</script>
<style>
:root{--red:#C0121C;--red-dark:#8B0000;--black:#0A0A0A;--gray-700:#444;--gray-500:#777;--gray-100:#f4f4f2;--white:#fff;--cream:#faf9f7;--font-display:'Playfair Display',Georgia,serif;--font-body:'Source Sans 3',Arial,sans-serif;--font-serif:'Source Serif 4',Georgia,serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--white);color:var(--black);font-size:16px;line-height:1.6}
a{text-decoration:none;color:inherit}
img{max-width:100%}
.topbar{background:var(--black);color:#ccc;font-size:12px;padding:6px 0;border-bottom:2px solid var(--red)}
.topbar-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.topbar a{color:#bbb;transition:color .2s}
.topbar a:hover{color:var(--red)}
header{background:var(--white);border-bottom:3px solid var(--black);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.masthead{max-width:1280px;margin:0 auto;padding:12px 20px 8px;display:flex;align-items:center;justify-content:space-between}
.logo-text{font-family:var(--font-display);font-size:38px;font-weight:900;letter-spacing:-2px;line-height:1}
.logo-text span{color:var(--red)}
.mainnav{background:var(--black)}
.mainnav-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;overflow-x:auto}
.mainnav-inner a{color:#ddd;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:12px 16px;white-space:nowrap;transition:all .2s;border-bottom:3px solid transparent}
.mainnav-inner a:hover,.mainnav-inner a.active{color:white;border-bottom-color:var(--red)}
.container{max-width:900px;margin:0 auto;padding:20px}
.article-header{margin-bottom:30px}
.article-category{display:inline-block;background:var(--red);color:white;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;margin-bottom:12px}
.article-title{font-family:var(--font-display);font-size:42px;font-weight:900;line-height:1.15;margin-bottom:16px;color:var(--black)}
.article-meta{font-size:14px;color:var(--gray-500);display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.article-meta span{display:flex;align-items:center;gap:5px}
.article-featured-img{margin-bottom:30px;border-radius:4px;overflow:hidden}
.article-featured-img img{width:100%;height:auto;max-height:500px;object-fit:cover}
.article-body{font-family:var(--font-serif);font-size:18px;line-height:1.85;color:#333}
.article-body p{margin-bottom:20px}
.share-bar{display:flex;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid #eee;flex-wrap:wrap}
.share-btn{padding:8px 16px;border-radius:2px;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:white;display:flex;align-items:center;gap:6px;cursor:pointer;transition:opacity .2s}
.share-btn:hover{opacity:.85}
.share-fb{background:#1877F2}
.share-tw{background:#000}
.share-wa{background:#25D366}
.share-mail{background:var(--red)}
.related-section{margin-top:50px}
.related-title{font-family:var(--font-display);font-size:22px;font-weight:700;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid var(--black)}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:700px){.related-grid{grid-template-columns:1fr}.article-title{font-size:28px}}
.related-card{background:var(--cream);border-radius:2px;overflow:hidden;cursor:pointer;transition:transform .2s}
.related-card:hover{transform:translateY(-3px)}
.related-card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.related-card-body{padding:12px}
.related-card-title{font-family:var(--font-display);font-size:14px;font-weight:700;line-height:1.3;color:var(--black)}
footer{background:var(--black);color:#aaa;margin-top:60px;padding:30px 20px;text-align:center;font-size:12px}
footer a{color:var(--red)}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <span><a href="index.html">← Torna alla Home</a></span>
    <span style="color:#aaa">ANKOAUTCA — Informazione indipendente</span>
  </div>
</div>
<header>
  <div class="masthead">
    <a href="index.html"><div class="logo-text"><span>A</span>NKOAUTCA</div></a>
  </div>
  <nav class="mainnav">
    <div class="mainnav-inner">
      <a href="index.html">Home</a><a href="Politica.html">Politica</a><a href="EConomia.html">Economia</a><a href="Mondo.html">Mondo</a><a href="Sport.html">Sport</a><a href="Tecnologia.html">Tecnologia</a>
    </div>
  </nav>
</header>
<div class="container" id="article-container">
  <div class="loading" style="text-align:center;padding:60px;font-style:italic;color:var(--gray-500)">
    <i class="ti ti-loader" style="animation:spin 1s linear infinite"></i> Caricamento articolo...
  </div>
</div>
<footer>
  <p>© 2025 ANKOAUTCA — <a href="mailto:gastroboostmarketingdegital@gmail.com">Collabora con noi</a></p>
</footer>
<style>@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
<script>
// Legge parametri URL
const params = new URLSearchParams(window.location.search);
const title = params.get('title') || 'Articolo non disponibile';
const description = params.get('desc') || 'Contenuto in caricamento...';
const image = params.get('img') || 'https://picsum.photos/seed/default/800/450';
const category = params.get('cat') || 'Notizie';
const author = params.get('author') || 'Redazione ANKOAUTCA';
const date = params.get('date') || new Date().toISOString();
const url = params.get('url') || '';

const months = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const d = new Date(date);
const formattedDate = d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();

function timeAgo(dateStr) {
  const diffMs = Date.now() - new Date(dateStr).getTime();
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 60) return diffMin + ' minuti fa';
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return diffH + ' ore fa';
  return Math.floor(diffH / 24) + ' giorni fa';
}

document.title = title + ' — ANKOAUTCA';
document.getElementById('article-container').innerHTML = `
  <div class="article-header">
    <span class="article-category">${category}</span>
    <h1 class="article-title">${title}</h1>
    <div class="article-meta">
      <span><i class="ti ti-user"></i> ${author}</span>
      <span><i class="ti ti-calendar"></i> ${formattedDate}</span>
      <span><i class="ti ti-clock"></i> ${timeAgo(date)}</span>
      <span><i class="ti ti-eye"></i> ${Math.floor(Math.random()*50000+10000).toLocaleString()} letture</span>
    </div>
  </div>
  <div class="article-featured-img">
    <img src="${image}" alt="${title}" onerror="this.src='https://picsum.photos/seed/fallback/800/450'">
  </div>
  <div class="article-body">
    <p><strong>${description}</strong></p>
    <p>Il presente articolo è stato generato automaticamente dal sistema ANKOAUTCA in collaborazione con le fonti giornalistiche più autorevoli. L'informazione viene costantemente aggiornata per garantire la massima accuratezza e tempestività.</p>
    <p>La redazione di ANKOAUTCA si impegna a fornire notizie verificate, approfondimenti e analisi indipendenti su tutti i temi di attualità, politica, economia, sport, cultura e tecnologia.</p>
    <p>Per ulteriori approfondimenti su questo argomento, visita la nostra <a href="categoria.html?cat=${encodeURIComponent(category)}" style="color:var(--red);text-decoration:underline">sezione ${category}</a> o utilizza la barra di ricerca per esplorare altri contenuti correlati.</p>
    ${url ? `<p style="margin-top:20px;font-size:14px;color:var(--gray-500)">Fonte originale: <a href="${url}" target="_blank" rel="nofollow" style="color:var(--red)">${new URL(url).hostname}</a></p>` : ''}
  </div>
  <div class="share-bar">
    <span style="font-weight:700;font-size:14px;color:var(--gray-700)">Condividi:</span>
    <a class="share-btn share-fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank"><i class="ti ti-brand-facebook"></i> Facebook</a>
    <a class="share-btn share-tw" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(window.location.href)}" target="_blank"><i class="ti ti-brand-x"></i> X</a>
    <a class="share-btn share-wa" href="https://wa.me/?text=${encodeURIComponent(title + ' ' + window.location.href)}" target="_blank"><i class="ti ti-brand-whatsapp"></i> WhatsApp</a>
    <a class="share-btn share-mail" href="mailto:?subject=${encodeURIComponent(title)}&body=${encodeURIComponent(window.location.href)}"><i class="ti ti-mail"></i> Email</a>
  </div>
  <div class="related-section">
    <div class="related-title">Articoli Correlati</div>
    <div class="related-grid" id="related-articles">
      <div style="text-align:center;color:var(--gray-500);padding:20px;">Caricamento articoli correlati...</div>
    </div>
  </div>
`;

// Carica articoli correlati dalla cache o genera fallback
const relatedGrid = document.getElementById('related-articles');
const cachedGeneral = localStorage.getItem('ankoautca_general_6_1');
if (cachedGeneral) {
  const articles = JSON.parse(cachedGeneral).articles.slice(0, 3);
  relatedGrid.innerHTML = articles.map(a => `
    <div class="related-card" onclick="location.href='articolo.html?title=${encodeURIComponent(a.title)}&desc=${encodeURIComponent(a.description||'')}&img=${encodeURIComponent(a.urlToImage||'https://picsum.photos/seed/rnd/400/300')}&cat=${encodeURIComponent(category)}&author=${encodeURIComponent(a.author||'Redazione')}&date=${encodeURIComponent(a.publishedAt)}&url=${encodeURIComponent(a.url||'')}'">
      <img src="${a.urlToImage || 'https://picsum.photos/seed/rnd/400/300'}" alt="" loading="lazy" onerror="this.src='https://picsum.photos/seed/err/400/300'">
      <div class="related-card-body"><div class="related-card-title">${a.title?.substring(0,80) || 'Articolo correlato'}</div></div>
    </div>
  `).join('');
} else {
  // Fallback semplice
  const fallbackTitles = ['Nuove misure economiche in arrivo', 'Riforma della giustizia approvata', 'Scoperta scientifica rivoluzionaria'];
  relatedGrid.innerHTML = fallbackTitles.map(t => `
    <div class="related-card" onclick="location.href='categoria.html?q=${encodeURIComponent(t)}'">
      <img src="https://picsum.photos/seed/${t.replace(/\s/g,'')}/400/300" alt="">
      <div class="related-card-body"><div class="related-card-title">${t}</div></div>
    </div>
  `).join('');
}
</script>
</body>
</html>
