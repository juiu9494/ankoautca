<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANKOAUTCA - Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --accent: #e94560;
  --text: #e0e0e0;
  --green: #00c853;
  --blue: #2196f3;
  --orange: #ff9800;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
}

.admin-header {
  background: var(--card);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--accent);
}

.logo { font-size: 24px; font-weight: 900; color: var(--accent); }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  padding: 24px;
}

.stat-card {
  background: var(--card);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid rgba(255,255,255,0.05);
}

.stat-value {
  font-size: 36px;
  font-weight: bold;
  margin: 8px 0;
}

.stat-label {
  color: #888;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.stat-icon {
  font-size: 24px;
  margin-bottom: 8px;
}

.live-table {
  margin: 24px;
  background: var(--card);
  border-radius: 12px;
  overflow: hidden;
}

.table-header {
  padding: 16px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  font-weight: bold;
  display: flex;
  justify-content: space-between;
}

.live-dot {
  width: 8px;
  height: 8px;
  background: var(--green);
  border-radius: 50%;
  display: inline-block;
  animation: pulse 1.5s infinite;
  margin-right: 8px;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  text-align: left;
  padding: 12px 24px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #888;
  background: rgba(0,0,0,0.2);
}

td {
  padding: 12px 24px;
  font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}

tr:hover td {
  background: rgba(233,69,96,0.05);
}

.badge {
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: bold;
}

.badge-new { background: var(--green); color: white; }
.badge-returning { background: var(--blue); color: white; }

.charts-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 0 24px 24px;
}

.chart-card {
  background: var(--card);
  border-radius: 12px;
  padding: 20px;
  min-height: 300px;
}

@media(max-width: 768px) {
  .charts-section { grid-template-columns: 1fr; }
}

.refresh-btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.auto-refresh {
  font-size: 12px;
  color: #888;
}
</style>
</head>
<body>

<div class="admin-header">
  <div class="logo">📊 ANKOAUTCA Admin</div>
  <div style="display:flex; gap:12px; align-items:center;">
    <span class="auto-refresh">Auto-refresh: 5s</span>
    <span style="display:flex; align-items:center;"><span class="live-dot"></span> Live</span>
    <button class="refresh-btn" onclick="loadData()">🔄 Rafraîchir</button>
    <a href="index.html" style="color:#888; text-decoration:none;">← Site</a>
  </div>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-icon">👥</div>
    <div class="stat-label">Visiteurs Aujourd'hui</div>
    <div class="stat-value" id="todayVisitors">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">🕐</div>
    <div class="stat-label">En Ligne Maintenant</div>
    <div class="stat-value" id="onlineNow" style="color: #00c853;">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">📄</div>
    <div class="stat-label">Pages Vues</div>
    <div class="stat-value" id="pageViews">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">⏱️</div>
    <div class="stat-label">Temps Moyen</div>
    <div class="stat-value" id="avgTime">0s</div>
  </div>
</div>

<div class="charts-section">
  <div class="chart-card">
    <h3 style="margin-bottom:16px;">📈 Trafic (Dernières 24h)</h3>
    <div id="chart24h" style="height:250px; display:flex; align-items:flex-end; gap:4px;"></div>
  </div>
  <div class="chart-card">
    <h3 style="margin-bottom:16px;">🌍 Pages les Plus Visitées</h3>
    <div id="topPages"></div>
  </div>
</div>

<div class="live-table">
  <div class="table-header">
    <span>🟢 Visiteurs en Direct</span>
    <span id="liveCount">0 actifs</span>
  </div>
  <div style="max-height:400px; overflow-y:auto;">
    <table>
      <thead>
        <tr>
          <th>Page</th>
          <th>Référent</th>
          <th>Arrivée</th>
          <th>Durée</th>
          <th>Appareil</th>
        </tr>
      </thead>
      <tbody id="liveVisitors"></tbody>
    </table>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
