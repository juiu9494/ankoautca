<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- LOGIN -->
<div id="loginOverlay">
  <input type="password" id="loginPassword" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Login</button>
  <div id="loginError"></div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <h1>Dashboard</h1>
  <button onclick="logout()">Logout</button>

  <div>
    Visitors: <span id="statVisitors">0</span><br>
    Articles: <span id="statArticles">0</span><br>
    Online: <span id="statOnline">0</span>
  </div>

  <div id="dashboardArticles"></div>
</div>

<script>
/* ===================== SUPABASE ===================== */
const SUPABASE_URL = 'https://rmugngceojbarttctsoo.supabase.co';
const SUPABASE_KEY = 'YOUR_ANON_KEY';

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===================== STATE ===================== */
let dashboardInterval = null;

/* ===================== INIT ===================== */
initAuth();

/* ===================== AUTH ===================== */
async function initAuth() {
  const { data } = await supa.auth.getSession();

  if (data.session) {
    showApp();
  }
}

async function login() {
  const password = document.getElementById('loginPassword').value;
  const errorBox = document.getElementById('loginError');

  errorBox.textContent = '';

  if (!password) {
    errorBox.textContent = 'Inserisci password';
    return;
  }

  const { data, error } = await supa.auth.signInWithPassword({
    email: 'admin@test.com',
    password
  });

  if (error) {
    errorBox.textContent = 'Password errata';
    return;
  }

  const { data: admin } = await supa
    .from('admins')
    .select('*')
    .eq('id', data.user.id)
    .single();

  if (!admin) {
    errorBox.textContent = 'Accesso negato';
    await supa.auth.signOut();
    return;
  }

  showApp();
}

/* ===================== UI ===================== */
function showApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  loadDashboard();
  startDashboardInterval();
}

/* ===================== LOGOUT ===================== */
async function logout() {
  stopDashboardInterval();
  await supa.auth.signOut();
  location.reload();
}

/* ===================== DASHBOARD ===================== */
async function loadDashboard() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();

  const [{ count: visitors }, { count: articles }, { count: online }, { data: list }] = await Promise.all([
    supa.from('visitor_real').select('*', { count: 'exact', head: true }).gte('created_at', today),
    supa.from('articles').select('*', { count: 'exact', head: true }),
    supa.from('visitor_real').select('*', { count: 'exact', head: true }),
    supa.from('articles').select('*').order('created_at', { ascending: false }).limit(5)
  ]);

  document.getElementById('statVisitors').textContent = visitors || 0;
  document.getElementById('statArticles').textContent = articles || 0;
  document.getElementById('statOnline').textContent = online || 0;

  document.getElementById('dashboardArticles').innerHTML =
    (list || []).map(a => `
      <div>
        <b>${a.title}</b> - ${a.category || ''} - ${a.author || ''}
      </div>
    `).join('');
}

/* ===================== INTERVAL ===================== */
function startDashboardInterval() {
  stopDashboardInterval();
  dashboardInterval = setInterval(loadDashboard, 15000);
}

function stopDashboardInterval() {
  if (dashboardInterval) {
    clearInterval(dashboardInterval);
    dashboardInterval = null;
  }
}
</script>

</body>
</html>
